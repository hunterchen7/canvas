name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: benchmarks/analyzer/go.mod
          cache-dependency-path: benchmarks/analyzer/go.mod

      - run: npm ci

      - name: Install browser runtime
        run: npm exec -- playwright install --with-deps chromium

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check package
        run: npm run type-check

      - name: Type-check benchmark fixtures
        run: npm run type-check:benchmarks

      - name: Run tests
        run: npm test

      - name: Verify native analyzer parity
        run: >-
          go -C benchmarks/analyzer test ./... &&
          node --test benchmarks/analyzer/differential.ts

      - name: Build package
        run: npm run build

  bundle-and-parity:
    name: Bundle and strict parity gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install browser runtime
        run: npm exec -- playwright install --with-deps chromium

      - name: Compare consumer bundles and package budget
        run: npm run bench:bundle:compare

      - name: Create untouched baseline worktree
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/canvas-baseline" "$BASELINE_SHA"

      - name: Run strict browser parity
        id: parity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          EXTRA_ARGS=()
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- src; then
            EXTRA_ARGS+=(--allow-identical-sources)
          fi
          npm run bench:parity -- \
            --baseline-root "$RUNNER_TEMP/canvas-baseline" \
            --candidate-root "$GITHUB_WORKSPACE" \
            --sections 100 \
            --output "$RUNNER_TEMP/canvas-parity" \
            "${EXTRA_ARGS[@]}"

      - name: Upload parity evidence
        if: always() && steps.parity.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: strict-parity-${{ github.sha }}
          path: ${{ runner.temp }}/canvas-parity
          if-no-files-found: error
          retention-days: 30
